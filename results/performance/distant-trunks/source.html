      let wet = 0;                                    /* soaked dark ground near all water lines */
      for (const B of BASINS) {
        const dz = wz - B.cz;
        if (dz > -B.up - 12 && dz < B.dn + 16 && Math.abs(wx - valleyCenterX(wz)) < B.rx + 25) {
          wet = Math.max(wet, clamp01((valleyFloor(B.cz) - 4 + 5 - h) / 10));
        }
      }
      wet = Math.max(wet, clamp01(channelCarve(wx, wz) / 7) * 0.7);
      wet = Math.max(wet, clamp01(plungeCarve(wx, wz) / 14) * 0.8);
      r = lerp(r, 0.09, wet * 0.55); g = lerp(g, 0.15, wet * 0.5); b = lerp(b, 0.09, wet * 0.5);
      col.setRGB(r, g, b, THREE.SRGBColorSpace);
      colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, terrainMaterial());
    mesh.name = 'TERRAIN_WESTERN_GHATS';
    mesh.receiveShadow = true;
    this.scene.add(mesh);
    addDistantRidges(this.scene, terrainHeight);
  }

  /* ================= vegetation & rocks — InstancedMesh(BufferGeometry) only ================= */
  _initVegetation() {
    const group = new THREE.Group();
    group.name = 'VEGETATION';

    const scatter = (count, cfg) => {
      const pts = []; let tries = 0;
      while (pts.length < count && tries < count * 40) {
        tries++;
        const x = (rng() * 2 - 1) * 780, z = (rng() * 2 - 1) * 780;
        const h = terrainHeight(x, z);
        if (h > cfg.maxH) continue;
        if (terrainSlope(x, z, h) > cfg.maxSlope) continue;
        let skip = false;
        for (const B of BASINS) {
          const dz = z - B.cz;
          const damZ=B.cz+B.dn;
          if(cfg.avoidPlunge && z>damZ-20 && z<damZ+45 && Math.abs(x-valleyCenterX(damZ))<B.rx*0.98) {
            skip=true;break; // Keep crowns/trunks clear of the crest, gate, and stilling basin.
          }
          if (dz > -B.up - 12 && dz < B.dn + 16 && Math.abs(x - valleyCenterX(z)) < B.rx + 22) {
            if (h < valleyFloor(B.cz) - 4 + (cfg.shore ? -1 : 2.5)) { skip = true; break; }
          }
        }
        if (skip) continue;
        if (cfg.avoidChannel && channelCarve(x, z) > 2.5) continue;
        if (cfg.avoidPlunge && plungeCarve(x, z) > 2) continue;
        if (cfg.gate && fbm(x * 0.012 + 40, z * 0.012 + 9) < cfg.gate) continue;
        pts.push({ x, z, h });
      }
      return pts;
    };
    const transforms = (pts, sMin, sMax) => pts.map(p => {
      const s = sMin + rng() * (sMax - sMin);
      return { x: p.x, y: p.h - 0.12, z: p.z, ry: rng() * Math.PI * 2,
               sx: s * (0.85 + rng() * 0.3), sy: s, sz: s * (0.85 + rng() * 0.3) };
    });
    /* hue = [baseH, hueRange, saturation, baseL, lightnessRange] */
    const instanced = (geo, mat, tf, hue, shadow) => {
      const mesh = new THREE.InstancedMesh(geo, mat, tf.length);   /* geometry is a BufferGeometry */
      const d = new THREE.Object3D(), c = new THREE.Color();
      for (let i = 0; i < tf.length; i++) {
        const t = tf[i];
        d.position.set(t.x, t.y, t.z);
        d.rotation.set(0, t.ry, 0);
        d.scale.set(t.sx, t.sy, t.sz);
        d.updateMatrix();
        mesh.setMatrixAt(i, d.matrix);
        if (hue) c.setHSL(hue[0] + rng() * hue[1], hue[2], hue[3] + rng() * hue[4], THREE.SRGBColorSpace);
        if (hue) mesh.setColorAt(i, c);
      }
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      mesh.computeBoundingSphere();
      mesh.frustumCulled = true;
      mesh.castShadow = !!shadow;
      mesh.receiveShadow = true;
      group.add(mesh);
      return mesh;
    };

    /* trees: shared transform list drives trunk + canopy InstancedMesh pair */
    const treePts = scatter(12500, { maxSlope: 2.7, maxH: 530, avoidChannel: true, avoidPlunge: true, gate: 0.26 });
    const treeTf = transforms(treePts, 1.3, 3.0);
    const trunkGeo = new THREE.CylinderGeometry(0.13, 0.24, 2.6, 7).translate(0, 1.3, 0);
    const canopyGeo = forestCrown(3.7);
    instanced(trunkGeo, new THREE.MeshStandardMaterial({ color: 0x4e3a2a, roughness: 0.95 }), treeTf, null, false).name='FOREST_TRUNKS';
    const canopy = instanced(canopyGeo, forestMaterial(),
      treeTf.filter((_,i)=>i%3 !== 0), [0.23, 0.12, 0.30, 0.13, 0.12], true);
    canopy.name = 'FOREST_CANOPY';
    const tallCanopy=instanced(forestCrown(9.1, true), canopy.material, treeTf.filter((_,i)=>i%3 === 0),
      [0.25, 0.10, 0.32, 0.12, 0.12], true);
    tallCanopy.name = 'FOREST_UPPER_CANOPY';
    this.forestLODs=[{mesh:canopy,near:canopy.geometry,far:forestCrown(3.7,false,true)},
      {mesh:tallCanopy,near:tallCanopy.geometry,far:forestCrown(9.1,true,true)}];

    const shrubPts = scatter(650, { maxSlope: 0.8, maxH: 200, avoidChannel: true, avoidPlunge: true, gate: 0.30 });
    instanced(jitterGeometry(new THREE.SphereGeometry(0.9, 6, 4), 0.4, 0.65, 0.45, 9.2),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }),
      transforms(shrubPts, 0.8, 2.0), [0.27, 0.08, 0.50, 0.24, 0.10], false);

    const grassPts = scatter(900, { maxSlope: 0.95, maxH: 190, avoidChannel: true, avoidPlunge: true, gate: 0.25 });
    instanced(jitterGeometry(new THREE.SphereGeometry(0.5, 5, 3), 0.45, 0.80, 0.22, 15.8),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0 }),
      transforms(grassPts, 0.5, 1.2), [0.24, 0.08, 0.60, 0.28, 0.12], false);

    const rockPts = scatter(1400, { maxSlope: 3.5, maxH: 600, shore: true, avoidChannel: false, avoidPlunge: false });
    const rock = instanced(jitterGeometry(new THREE.DodecahedronGeometry(1.1, 0), 0.28, 1, 0, 21.4),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, metalness: 0.05 }),
      transforms(rockPts, 1.0, 4.4), [0.12, 0.02, 0.08, 0.22, 0.15], true);
    rock.name = 'ROCKS';

    this.forestLODs=partitionForest(group,this.forestLODs);
    this.scene.add(group);
  }

  /* ================= dams, gates, spillways ================= */
  _initDams() {
    this.concreteMat = new THREE.MeshStandardMaterial({ map: concreteTex, roughness: 0.85, metalness: 0.08 });
    this.metalMat = new THREE.MeshStandardMaterial({ color: 0x86999b, roughness: 0.4, metalness: 0.5 });
    this.darkMat = new THREE.MeshStandardMaterial({ color: 0x14181b, roughness: 0.9 });

    for (const r of this.R) {
      const { D, base, crest, sill } = r;
      const H = crest - base;
      const parts = [];
      const segs = 24, span = r.B.rx * 1.9, radius = r.B.id === 4 ? 520 : 900, segW = span / segs;

      /* arched gravity wall (convex upstream) + crest road + railings */
      for (let s = 0; s < segs; s++) {
        const frac = (s + 0.5) / segs - 0.5;
        const ang = frac * (span / radius);
        const x = D.xc + Math.sin(ang) * radius;
        const z = D.zd + (Math.cos(ang) - 1) * radius;
        const yaw = ang;
        const wall = new THREE.BoxGeometry(segW + 0.15, H, 12);
        const face = wall.attributes.position;
        for (let v=0;v<face.count;v++) {
          // Gravity section widens toward its foundation, rather than a cuboid.
          if (face.getZ(v)>0) face.setZ(v,6+(1-(face.getY(v)+H/2)/H)*12);
        }
        wall.computeVertexNormals();
        wall.rotateY(yaw); wall.translate(x, base + H / 2, z); parts.push(wall);
        const road = new THREE.BoxGeometry(segW + 2.2, 1.2, 14.5);
        road.rotateY(yaw); road.translate(x, crest + 0.6, z); parts.push(road);
        for (const zo of [-6.4, 6.4]) {
          const rail = new THREE.BoxGeometry(segW + 2.2, 0.9, 0.25);
          rail.rotateY(yaw); rail.translate(x, crest + 1.3, z + zo); parts.push(rail);
        }
      }
      /* spillway piers */
      for (const xo of [-15, 15]) {
        const pier = new THREE.BoxGeometry(4, crest - sill + 5, 9);
        pier.translate(D.xc + xo, (sill - 2 + crest + 3) / 2, D.zd - 2); parts.push(pier);
      }
      /* ski-jump chute: from sill down to the plunge pool, terrain-derived endpoint */
      const cTop = new THREE.Vector3(D.xc, sill, D.zd + 4);
      const cBot = new THREE.Vector3(D.xc, terrainHeight(D.xc, D.zd + 24) + 0.6, D.zd + 24);
      const cDir = new THREE.Vector3().subVectors(cBot, cTop).normalize();
      const cLen = cTop.distanceTo(cBot) + 2;
      const chute = new THREE.BoxGeometry(26, cLen, 5);
      chute.applyMatrix4(new THREE.Matrix4().compose(
        new THREE.Vector3().addVectors(cTop, cBot).multiplyScalar(0.5),
        new THREE.Quaternion().setFromUnitVectors(UP, cDir),
        new THREE.Vector3(1, 1, 1)));
      chute.translate(0,-3,0); // Seat concrete below the water sheet, including its upper face.
      parts.push(chute);
      /* control tower on right abutment */
      const tX = D.xc + span * 0.42, tZ = D.zd - 10, tY = crest - 16;
      parts.push(new THREE.CylinderGeometry(2.6, 3.2, 16, 10).translate(tX, tY + 8, tZ));
      parts.push(new THREE.BoxGeometry(8, 3.5, 8).translate(tX, tY + 17, tZ));

      // Spillway at the crest is a separate structure and separate water path.
      for (const xo of [18, 38]) {
        parts.push(new THREE.BoxGeometry(2.4, 10, 11).translate(D.xc+xo,crest+3,D.zd));
      }
      parts.push(new THREE.BoxGeometry(24, 1.3, 5).translate(D.xc+28,crest+8,D.zd));
      parts.push(new THREE.BoxGeometry(34, 2, 28).translate(D.xc, cBot.y-1, D.zd+25));
      // Stilling basin walls and baffles connect the gate chute to its channel.
      for (const xo of [-16,16]) parts.push(new THREE.BoxGeometry(2,5,27).translate(D.xc+xo,cBot.y+1,D.zd+25));
      for (const xo of [-9,-3,3,9]) parts.push(new THREE.BoxGeometry(2,3,2).translate(D.xc+xo,cBot.y+1,D.zd+34));

      const dam = new THREE.Mesh(mergeGeometries(parts, false), this.concreteMat);
      dam.castShadow = true; dam.receiveShadow = true;
      dam.name = 'DAM_0' + r.B.id;
      this.scene.add(dam);
      const roadPoints=[];
      const roadAngle=span/(2*radius);
      const roadX=D.xc+Math.sin(roadAngle)*radius, roadZ=D.zd+(Math.cos(roadAngle)-1)*radius;
      for(let s=0;s<=28;s++) {
        const t=s/28,x=roadX+t*100,z=roadZ-t*55+Math.sin(t*Math.PI)*18;
        roadPoints.push(new THREE.Vector3(x,lerp(crest+1.3,terrainHeight(x,z)+0.8,smooth01(t)),z));
      }
      const roadGeometry=ribbonGeometry(roadPoints,5);roadGeometry.computeVertexNormals();
      const access=new THREE.Mesh(roadGeometry,new THREE.MeshStandardMaterial({color:0x6a6b60,roughness:1,side:THREE.DoubleSide}));
      access.name='SERVICE_ACCESS_0'+r.B.id;access.receiveShadow=true;this.scene.add(access);

      /* hoist beam (metal, static) */
      const hoist = new THREE.Mesh(new THREE.BoxGeometry(34, 1.5, 3), this.metalMat);
      hoist.position.set(D.xc, crest + 3.2, D.zd - 2);
      hoist.castShadow = true;
      dam.add(hoist);

      /* dark gate opening on the visible downstream face — revealed as the gate lifts */
      const opening = new THREE.Mesh(new THREE.BoxGeometry(24, 8.5, 1.2), this.darkMat);
      opening.name = 'GATE_OPENING_0' + r.B.id;
      opening.position.set(D.xc, sill + 3.5, D.zd + 11);
      dam.add(opening);

      /* GATE — the only animated dam part; slide = gate opening */
      const gate = new THREE.Mesh(new THREE.BoxGeometry(22, 9, 1.4), this.metalMat);
      gate.name = 'GATE_0' + r.B.id;
      gate.position.set(D.xc, sill + 3.8, D.zd + 12);
      gate.castShadow = true;
      dam.add(gate);
      r.gateMesh = gate;
      r.gateClosedY = sill + 3.8;
      r.gateTravel = 8;

      /* spillway jet (flow-driven) + plunge spray */
      const jTop = new THREE.Vector3(D.xc, sill + 1, D.zd + 13);
      const jBot = new THREE.Vector3(D.xc, terrainSurfaceHeight(D.xc, D.zd + 22) + 2.2, D.zd + 22);
      const jCtrl = new THREE.Vector3(D.xc, sill + 2, D.zd + 18);
      r.jetMat = new THREE.ShaderMaterial({
        vertexShader: FLOW_VERT, fragmentShader: FLOW_FRAG, transparent: true,
        depthWrite: false, side: THREE.DoubleSide,
        uniforms: {
          uTime: { value: 0 }, uFlow: { value: 0 }, uWhite: { value: 0.95 },
          uFogColor: { value: new THREE.Color(0xb9c3ca) }, uFogDensity: { value: 0.0016 },
        },
      });
      const jet = new THREE.Mesh(
        ribbonGeometry(new THREE.QuadraticBezierCurve3(jTop, jCtrl, jBot).getPoints(24), 22),
        r.jetMat);
      jet.name = 'SPILLWAY_JET_0' + r.B.id;
      jet.renderOrder = 1;
      this.scene.add(jet);
      r.jetMesh = jet;
      // Local-spill ribbon, driven only by reported spill volume.
      r.spillMat = r.jetMat.clone();
      const spillPath = new THREE.CatmullRomCurve3([
        new THREE.Vector3(D.xc+28,crest-1,D.zd-5),
        new THREE.Vector3(D.xc+28,crest-1,D.zd+8),
        new THREE.Vector3(D.xc+26,jBot.y+5,D.zd+27),
        new THREE.Vector3(valleyCenterX(D.zd+42),terrainSurfaceHeight(valleyCenterX(D.zd+42),D.zd+42)+2.4,D.zd+42),
      ]);
      r.spillMesh = new THREE.Mesh(ribbonGeometry(spillPath.getPoints(36),16), r.spillMat);
      r.spillMesh.name = 'SEPARATE_OVERFLOW_0' + r.B.id;
      r.spillImpact = spillPath.getPoint(1);
      r.spillMesh.visible = false;
      r.spillMesh.renderOrder = 1;
      this.scene.add(r.spillMesh);
      r.plunge = jBot;

      const sprayN = 320;
      const sprayPos = new Float32Array(sprayN * 3);
      r.sprayVel = new Float32Array(sprayN * 3);
      for (let i = 0; i < sprayN; i++) {
        sprayPos[i * 3] = jBot.x; sprayPos[i * 3 + 1] = jBot.y; sprayPos[i * 3 + 2] = jBot.z;
        this._respawnSpray(r, i);
      }
      const sprayGeo = new THREE.BufferGeometry();
      sprayGeo.setAttribute('position', new THREE.BufferAttribute(sprayPos, 3));
      r.sprayMat = new THREE.PointsMaterial({
        map: mistTex, color: 0xf2f8fc, size: 3.0, transparent: true, opacity: 0,
        depthWrite: false, sizeAttenuation: true,
      });
      const spray = new THREE.Points(sprayGeo, r.sprayMat);
      spray.name = 'PLUNGE_SPRAY_0' + r.B.id;
      spray.renderOrder = 4;
      spray.frustumCulled = false;
      this.scene.add(spray);
      r.spray = spray;
    }
  }
  _respawnSpray(r, i) {
    r.sprayVel[i * 3] = (rng() - 0.5) * 10;
    r.sprayVel[i * 3 + 1] = 8 + rng() * 10;
    r.sprayVel[i * 3 + 2] = (rng() - 0.5) * 10 + 4;
  }

  /* ================= reservoir water — terrain-aware shader surface ================= */
  _initWater() {
    for (const r of this.R) {
      const B = r.B;
      const cx = valleyCenterX(B.cz);
      // Static local environment capture: actual 3D ridges/forest/sky, no photograph.
      // Baked once; the animation loop never renders reflection cameras.
      const environment = new THREE.WebGLCubeRenderTarget(64,{type:THREE.HalfFloatType});
      const probe = new THREE.CubeCamera(2,5000,environment);
      probe.position.set(cx,r.full+5,B.cz);
      probe.update(this.renderer,this.scene);
      r.environmentTarget=environment;
      const zC = B.cz + (B.dn - B.up) / 2;                       /* asymmetric: upstream margin, ends inside dam wall */
      const L = B.up + B.dn + 15;
      const geo = new THREE.PlaneGeometry(B.rx * 3, L, 96, 80);
      const pos = geo.attributes.position;
      const aTerrain = new Float32Array(pos.count);
      for (let i = 0; i < pos.count; i++) {
        aTerrain[i] = terrainSurfaceHeight(pos.getX(i) + cx, -pos.getY(i) + zC);
      }
      geo.setAttribute('aTerrain', new THREE.BufferAttribute(aTerrain, 1));
      r.waterMat = new THREE.ShaderMaterial({
        vertexShader: WATER_VERT, fragmentShader: WATER_FRAG,
        transparent: true, depthWrite: true, side: THREE.FrontSide,
        uniforms: {
          uTime: { value: 0 }, uWaveAmp: { value: 0.8 }, uLevelY: { value: r.minY },
          uRain: { value: 0.5 },
          uSelected: { value: 0 },
          uDeep: { value: new THREE.Color(0x0a3d46) },
          uShallow: { value: new THREE.Color(0x1f6e64) },
          uSky: { value: new THREE.Color(0xb9c8d2) },
          uEnvironment: { value: environment.texture },
          uSunDir: { value: this.sun.position.clone().normalize() },
          uFogColor: { value: new THREE.Color(0xb9c3ca) },
          uFogDensity: { value: 0.0016 },
        },
      });
      const mesh = new THREE.Mesh(geo, r.waterMat);
      mesh.name = 'WATER_0' + B.id;
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(cx, r.minY, zC);
      mesh.renderOrder = 2;                       /* after jets/channels → correct submergence */
      const resGroup = new THREE.Group();
      resGroup.name = 'RESERVOIR_0' + B.id;
      resGroup.userData = { basin: B, full: r.full, minLevel: r.minY };
      resGroup.add(mesh);
      this.scene.add(resGroup);
      r.waterMesh = mesh;
    }
  }

  /* ================= channels + inflows (release/inflow-driven) ================= */
  _initChannels() {
    const flowMat = white => new THREE.ShaderMaterial({
      vertexShader: FLOW_VERT, fragmentShader: FLOW_FRAG,
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      uniforms: {
        uTime: { value: 0 }, uFlow: { value: 0.5 }, uWhite: { value: white },
        uFogColor: { value: new THREE.Color(0xb9c3ca) }, uFogDensity: { value: 0.0016 },
      },
    });
    this.flowMeshes = [];
    const addFlow = (geo, name, white, key) => {
      const mat = flowMat(white);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.name = name;
      const inletBlendStart = geo.userData.inletBlendStart;
      const hasReceiver = typeof inletBlendStart === 'number';
      mesh.renderOrder = hasReceiver ? 3 : 1;
      this.scene.add(mesh);
      const receiver = hasReceiver ? this.R[Number(key.slice(-1))] : null;
      this.flowMeshes.push({ mat, key, mesh, flowCur: 0, flowTarget: 0,
        receiver, inletBlendStart,
        basePositions: receiver ? geo.attributes.position.array.slice() : null });
      const flow = this.flowMeshes[this.flowMeshes.length-1];
      const foam = new THREE.InstancedMesh(new THREE.SphereGeometry(1,6,4),
        new THREE.MeshBasicMaterial({color:0xc9dfdb,transparent:true,opacity:0.65,depthWrite:false}),3);
      foam.name = name + '_TRAVELLING_FOAM'; foam.renderOrder=4;
      foam.frustumCulled=false; this.scene.add(foam);
      flow.foam=foam; flow.foamPhase=0; flow.foamTransform=new THREE.Object3D();
      flow.foamOffsets=[0.03,0.383,0.771];
      const points=geo.attributes.position;
      let length=0;
      for(let i=2;i<points.count;i+=2)length+=Math.hypot(points.getX(i)-points.getX(i-2),points.getZ(i)-points.getZ(i-2));
      flow.pathLength=Math.max(1,length);
    };
    // A → B → C → D → downstream. Visual paths only; backend flow remains authoritative.
    this.R.forEach((r, i) => {
      const next = this.R[i + 1];
      addFlow(hydraulicLinkRibbon(r, next, !next),
        'CHANNEL_0' + (i + 1), 0.18, 'ch' + (i + 1));
      const z = (r.D.zd + 22 + (next ? next.B.cz + 15 : 590)) / 2;
      const x = valleyCenterX(z);
      const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1),
        new THREE.Vector3(x, terrainHeight(x,z) + 9, z - 9), 22, 0xe9c86b, 9, 6);
      arrow.name = 'TOPOLOGY_DIRECTION_0' + (i + 1);
      this.scene.add(arrow);
    });
    addFlow(terrainRibbon(-520, -435, 4, 16), 'INFLOW_01', 0.42, 'in1');
    // Overflow remains independently bound and independently meshed after its
    // confluence. Terminal river already uses the authoritative downstream total.
    this.R.slice(0,3).forEach((r,i)=>{
      addFlow(hydraulicLinkRibbon(r,this.R[i+1],false,42),'SPILL_CONTINUATION_0'+(i+1),0.65,'sp'+(i+1));
      this.flowMeshes[this.flowMeshes.length-1].mesh.position.y=0.12;
    });

  }

  /* ================= rain — ONE particle system ================= */
  _initRain() {
    const N = 6000;
    this.rainVel = new Float32Array(N * 3);
    const posArr = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      posArr[i * 3] = (rng() - 0.5) * 560;
      posArr[i * 3 + 1] = rng() * 240;
      posArr[i * 3 + 2] = (rng() - 0.5) * 560;
      this.rainVel[i * 3] = 14 + rng() * 10;
      this.rainVel[i * 3 + 1] = -(80 + rng() * 30);
      this.rainVel[i * 3 + 2] = (rng() - 0.5) * 10;
    }
    this.rainGeo = new THREE.BufferGeometry();
    this.rainGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    this.rainGeo.setDrawRange(0, 4000);
    this.rainMat = new THREE.PointsMaterial({
      map: rainTex, color: 0xcfe2ee, size: 2.0, transparent: true, opacity: 0.55,
      depthWrite: false, sizeAttenuation: true,
    });
    this.rain = new THREE.Points(this.rainGeo, this.rainMat);
    this.rain.name = 'RAIN_SYSTEM';
    this.rain.renderOrder = 5;
    this.rain.frustumCulled = false;
    this.scene.add(this.rain);
  }

  /* ================= mist + low clouds (horizontal layers) ================= */
  _initMist() {
    this.mistPlanes = [];
    const addMist = (y, w, h, op, spd, cloud) => {
      const mat = new THREE.MeshBasicMaterial({
        map: mistTex, transparent: true, opacity: op, depthWrite: false,
        side: THREE.DoubleSide, color: cloud ? 0xd8e0e6 : 0xc4d0d8,
        fog: !cloud,                               /* high clouds must not dissolve into fog */
      });
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      m.position.set((rng() - 0.5) * 700, y, (rng() - 0.5) * 700);
      m.rotation.x = -Math.PI / 2 + (rng() - 0.5) * 0.25;
      m.rotation.y = rng() * Math.PI;
      m.renderOrder = 3;
      m.frustumCulled = false;
      this.scene.add(m);
      this.mistPlanes.push({ mesh: m, baseO: op, speed: spd, phase: rng() * 10, cloud });
    };
    for (let i = 0; i < 4; i++) addMist(25 + rng() * 85, 380 + rng() * 160, 110 + rng() * 60, 0.08 + rng() * 0.08, 2 + rng() * 3, false);
    for (let i = 0; i < 2; i++) addMist(260 + rng() * 80, 640 + rng() * 260, 220, 0.12 + rng() * 0.06, 1 + rng() * 1.5, true);
    const g = new THREE.Group(); g.name = 'MIST_LAYER'; this.scene.add(g);
  }

  /* ================= camera controls ================= */
  _initControls() {
    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.06;
    this.controls.minDistance = 40;
    this.controls.maxDistance = 2000;
    this.controls.maxPolarAngle = 1.52;
    this.controls.target.set(...PRESETS.overview.t);
  }
  _updateCameraTween(dt) {
    if (!this._tween) return;
    const tw = this._tween;
    tw.t += dt / 1.6;
    const k = smooth01(tw.t);
    this.camera.position.lerpVectors(tw.fromP, tw.toP, k);
    this.controls.target.lerpVectors(tw.fromT, tw.toT, k);
    if (tw.t >= 1) { this._tween = null; this.controls.enabled = true; }
  }

  /* ================= per-frame subsystem updates ================= */
  _updateStorm(dt) {
    const s = this.storm;
    s.cur += (s.tgt - s.cur) * Math.min(1, dt * 0.6);
    const c = s.cur;
    const base = this._themeBase || { fogDensity: 0.0014, sunInt: 1.5, hemiInt: 0.85 };
    this.scene.fog.density = base.fogDensity + c * STORM_FOG;
    this.sun.intensity = base.sunInt - c * (base.sunInt * 0.5);
    this.hemi.intensity = base.hemiInt - c * (base.hemiInt * 0.35);
    this.rainMat.opacity = 0.28 + c * 0.42;
    this.rainGeo.setDrawRange(0, Math.floor(c * 6000));
    for (const r of this.R) {
      r.waterMat.uniforms.uRain.value = c;
      r.waterMat.uniforms.uWaveAmp.value = 0.12 + c * 0.18;
    }
  }

  _updateWater(dt) {
    for (const r of this.R) {
      r.levelCur += (r.levelTgt - r.levelCur) * Math.min(1, dt * 0.8);
      const y = lerp(r.minY, r.full, r.levelCur);
      if(Math.abs(r.waterMesh.position.y-y)>.001)this._connectorDirty=true;
      r.waterMesh.position.y = y;                 /* REAL surface movement, not a label */
      r.waterMat.uniforms.uTime.value = this._time;
      r.waterMat.uniforms.uLevelY.value = y;
      r.waterY = y;
    }
    for (const fm of this.flowMeshes) {
      if (fm.receiver && fm.lastReceiverY!==fm.receiver.waterY) {
        fm.lastReceiverY=fm.receiver.waterY;
        const position = fm.mesh.geometry.attributes.position;
        const uv = fm.mesh.geometry.attributes.uv;
        const base = fm.basePositions;
        const start = fm.inletBlendStart;
        for (let i = 0; i < position.count; i++) {
          const blend = smooth01(clamp01((uv.getY(i) - start) / (1 - start)));
          const yIndex = i * 3 + 1;
          position.array[yIndex] = Math.max(base[yIndex],lerp(base[yIndex], fm.receiver.waterY + 0.28, blend));
        }
        position.needsUpdate = true;
      }
      fm.mat.uniforms.uTime.value = this._time;
      fm.flowCur += (fm.flowTarget - fm.flowCur) * (1 - Math.exp(-dt * 3));
      fm.mat.uniforms.uFlow.value = fm.flowCur;
      fm.foam.visible=fm.mesh.visible && fm.flowCur>0.001;
      if(fm.foam.visible) {
        // Less than half a marker spacing per second avoids stroboscopic reversal.
        // Presentation speed only; this is not a reported hydraulic velocity.
        fm.foamPhase=(fm.foamPhase+dt*(0.035+fm.flowCur*0.025))%1;
        const pos=fm.mesh.geometry.attributes.position, pairs=pos.count/2;
        const object=fm.foamTransform;
        for(let i=0;i<3;i++) {
          const t=(fm.foamPhase+fm.foamOffsets[i])%1;
          const f=t*(pairs-1), a=Math.floor(f)*2,b=Math.min(a+2,pos.count-2), k=f-Math.floor(f);
          const ax=(pos.getX(a)+pos.getX(a+1))/2,az=(pos.getZ(a)+pos.getZ(a+1))/2;
          const bx=(pos.getX(b)+pos.getX(b+1))/2,bz=(pos.getZ(b)+pos.getZ(b+1))/2;
          object.position.set(lerp(ax,bx,k),lerp(pos.getY(a),pos.getY(b),k)+0.55,lerp(az,bz,k));
          object.rotation.y=Math.atan2(bx-ax,bz-az);
          const fade=Math.min(1,t*20,(1-t)*20)*Math.sqrt(fm.flowCur);
          const shape=i===0 ? 1 : i===1 ? 0.72 : 0.48;
          object.scale.set(2.8*fade*shape,0.17,5.5*fade*shape);object.updateMatrix();
          fm.foam.setMatrixAt(i,object.matrix);
        }
        fm.foam.instanceMatrix.needsUpdate=true;
      }
    }
  }

  _updateGatesAndJets(dt) {
    for (const r of this.R) {
      r.gateCur += (r.gateTgt - r.gateCur) * (1 - Math.exp(-dt * 2.5));
      r.gateMesh.position.y = r.gateClosedY + r.gateCur * r.gateTravel;

      // Normalization controls visual strength only, never physical flow.
      // Unknown flow is hidden; no gate/head inference.
      r.jetMesh.visible = false; r.spillMesh.visible = false; r.jetTgt = 0;
      if (typeof r.data.controlledRelease === 'number' && Number.isFinite(r.data.controlledRelease)) {
        r.jetTgt = Math.max(0,r.data.controlledRelease) / (Math.max(0,r.data.controlledRelease)+70);
        r.jetMesh.visible = r.data.controlledRelease > 0;
      }
      if (typeof r.data.spill === 'number' && Number.isFinite(r.data.spill)) {
        r.spillMesh.visible = r.data.spill > 0;
        r.spillMat.uniforms.uFlow.value = Math.max(0,r.data.spill) / (Math.max(0,r.data.spill)+5);
      }
      r.spillMat.uniforms.uTime.value = this._time;
      r.jetFlow += (r.jetTgt - r.jetFlow) * Math.min(1, dt * 3);
      r.jetMat.uniforms.uFlow.value = r.jetFlow;
      r.jetMat.uniforms.uTime.value = this._time;

      const sprayStrength = Math.max(r.jetMesh.visible ? r.jetFlow : 0, r.spillMesh.visible ? r.spillMat.uniforms.uFlow.value : 0);
      const active = sprayStrength > 0.06;
      r.spray.visible = active;
      r.sprayMat.opacity = sprayStrength * 0.7;
      if (active) {
        const p = r.spray.geometry.attributes.position.array;
        const origin = r.jetMesh.visible ? r.plunge : r.spillImpact;
        if(r.lastSprayOrigin !== origin) {
          for(let i=0;i<p.length;i+=3){p[i]=origin.x;p[i+1]=origin.y;p[i+2]=origin.z;}
          r.lastSprayOrigin=origin;
        }
        for (let i = 0; i < p.length / 3; i++) {
          p[i * 3] += r.sprayVel[i * 3] * dt;
          p[i * 3 + 1] += r.sprayVel[i * 3 + 1] * dt;
          p[i * 3 + 2] += r.sprayVel[i * 3 + 2] * dt;
          r.sprayVel[i * 3 + 1] -= 30 * dt;
          if (p[i * 3 + 1] < origin.y) {
            p[i * 3] = origin.x; p[i * 3 + 1] = origin.y; p[i * 3 + 2] = origin.z;
            this._respawnSpray(r, i);
          }
        }
        r.spray.geometry.attributes.position.needsUpdate = true;
      }
    }
  }

  _updateRain(dt) {
    if(this.rainGeo.drawRange.count===0)return;
    this.rain.position.x += (this.controls.target.x - this.rain.position.x) * Math.min(1, dt * 1.5);
    this.rain.position.z += (this.controls.target.z - this.rain.position.z) * Math.min(1, dt * 1.5);
    const p = this.rainGeo.attributes.position.array;
    const N = p.length / 3;
    for (let i = 0; i < N; i++) {
      const i3 = i * 3;
      p[i3] += this.rainVel[i3] * dt;
      p[i3 + 1] += this.rainVel[i3 + 1] * dt;
      p[i3 + 2] += this.rainVel[i3 + 2] * dt;
      if (p[i3 + 1] < 0) { p[i3 + 1] = 170 + rng() * 70; p[i3] = (rng() - 0.5) * 560; p[i3 + 2] = (rng() - 0.5) * 560; }
      if (p[i3] > 300) p[i3] -= 600; else if (p[i3] < -300) p[i3] += 600;
      if (p[i3 + 2] > 300) p[i3 + 2] -= 600; else if (p[i3 + 2] < -300) p[i3 + 2] += 600;
    }
    this.rainGeo.attributes.position.needsUpdate = true;
  }

  _updateMist(dt) {
    const s = this.storm.cur;
    for (const m of this.mistPlanes) {
      m.mesh.position.x += m.speed * dt * (m.cloud ? 0.5 : 1);
      if (m.mesh.position.x > 420) m.mesh.position.x = -420;
      m.mesh.material.opacity = m.baseO * (0.55 + s * 0.95) *
        (0.75 + 0.25 * Math.sin(this._time * 0.25 + m.phase));
    }
  }

  _cachePanelAnchors() {
    if (!this.el) return;
    this.panelAnchors = this.el.res.map((re, i) => {
      const rect = re.panel.getBoundingClientRect();
      return { x: i === 0 ? rect.right : rect.left, y: rect.top + rect.height / 2 };
    });
  }

  _updateConnectors() {
    if (!this.connLines || !this.panelAnchors) return;
    this._connectorCamera ||= new THREE.Matrix4();
    if(!this._connectorDirty && this._connectorVersion===this._labelVersion && this._connectorCamera.equals(this.camera.matrixWorld))return;
    this._connectorDirty=false;this._connectorVersion=this._labelVersion;this._connectorCamera.copy(this.camera.matrixWorld);
    const w = this.renderer.domElement.clientWidth, h = this.renderer.domElement.clientHeight;
    const viewport = this.renderer.domElement.getBoundingClientRect();
    /* floating label anchor points: R1/R2/R3 above their basins, DS at the downstream pool */
    const labelWorld = this._labelWorld || (this._labelWorld = [
      ...this.R.map(r => ({ x: valleyCenterX(r.B.cz), y: 0, z: r.B.cz })),
      { x: 40, y: -25, z: 520 },
    ]);
    for (let i = 0; i < this.R.length; i++) labelWorld[i].y = (this.R[i].waterY || this.R[i].minY) + 42;
    let previousX = -1000, previousY = -1000;
    for (let i = 0; i < this.fLabels.length; i++) {
      const lw = labelWorld[i];
      this._v3.set(lw.x, lw.y, lw.z).project(this.camera);
      const label = this.fLabels[i];
      const line = this.connLines[i], dot = this.connDots[i];
      if (this._v3.z > 1 || this._v3.z < -1 || Math.abs(this._v3.x) > 1.15 || Math.abs(this._v3.y) > 1.15) {
        setStyle(label, 'opacity', '0');
        setStyle(line, 'display', 'none');
        setStyle(dot, 'display', 'none');
        continue;
      }
      const sx = viewport.left + (this._v3.x * 0.5 + 0.5) * w, sy = viewport.top + (-this._v3.y * 0.5 + 0.5) * h;
      if (label) {
        setStyle(label, 'opacity', '1');
        const lx = Math.max(viewport.left + 76, Math.min(viewport.right - 76, sx));
        let ly = Math.max(viewport.top + 100, Math.min(viewport.bottom - 6, sy));
        if (Math.abs(lx - previousX) < 155 && Math.abs(ly - previousY) < 90) ly = Math.min(viewport.bottom-6,previousY+94);
        previousX = lx; previousY = ly;
        setStyle(label, 'left', lx.toFixed(2) + 'px');
        setStyle(label, 'top', ly.toFixed(2) + 'px');
        if (this.el && this.el.flLvl[i] && label._stateVersion !== this._labelVersion) {
          label._stateVersion = this._labelVersion;
          const d = i < this.R.length ? this.R[i].data : null;
          const dOk = !!(this.data.hasState && d && typeof d.level === 'number');
          this.el.flLvl[i].textContent = dOk ? (typeof d.storage === 'number' ? 'Storage ' + (d.storage * 100).toFixed(0) + '%' : 'Storage --')
            : (i === this.R.length && typeof this.data.downstream === 'number'
               ? this.data.downstream.toFixed(0) + ' m³/s' : '--');
          setText(label._detail, d ? 'Inflow ' + (typeof d.inflow === 'number' ? d.inflow.toFixed(1) + ' m³/s' : '--')
            : 'Safe limit ' + (typeof this.data.downstreamCapacity === 'number' ? this.data.downstreamCapacity.toFixed(1) + ' m³/s' : '--'));
          if (dOk) {
            /* gate % — reservoirs only */
            if (this.el.flGate[i]) this.el.flGate[i].textContent = (typeof d.gate === 'number' ? (d.gate * 100).toFixed(0) + '%' : '--');
            /* risk chip + label tint — backend string verbatim via RISK_UI */
            const ru = riskUi(d.risk) || {cls:'unknown', label:'UNKNOWN'};
            if (this.el.flRisk[i]) {
              this.el.flRisk[i].textContent = ru.label;
              this.el.flRisk[i].className = 'fl-risk chip ' + ru.cls;
            }
            label.className = 'flabel r-' + ru.cls + (label.classList.contains('selected') ? ' selected' : '');
          } else {
            /* STAGE 12 — DS label. The severity string is the BACKEND's; the
             * browser no longer applies its own flow thresholds. */
            const dst = this.data.hasState ? String(this.data.downstreamStatus || 'UNKNOWN') : 'UNKNOWN';
            const ru = riskUi(dst) || {cls:'unknown', label:'UNKNOWN'};
            if (this.el.flRisk[i]) {
              this.el.flRisk[i].textContent = ru.label;
              this.el.flRisk[i].className = 'fl-risk chip ' + ru.cls;
            }
            label.className = 'flabel r-' + ru.cls;
          }
        }
      }
      if (i < this.R.length) {

        setStyle(line, 'display', '');
        setStyle(dot, 'display', '');
        setAttr(line, 'x1', a.x); setAttr(line, 'y1', a.y);
        setAttr(line, 'x2', sx.toFixed(2)); setAttr(line, 'y2', sy.toFixed(2));
        setAttr(dot, 'cx', sx.toFixed(2)); setAttr(dot, 'cy', sy.toFixed(2));
        /* risk-tinted connector line + dot */
        const ru = riskUi(this.R[i].data.risk) || RISK_UI.normal;
        const tint = ru.cls === 'normal' ? 'var(--accent-line)' :
          ru.cls === 'watch' || ru.cls === 'warning' ? 'var(--warn)' :
          ru.cls === 'alert' ? 'var(--alert)' : 'var(--bad)';
        setStyle(line, 'stroke', tint);
        setAttr(dot, 'stroke', ru.cls === 'normal' ? 'var(--accent)' : tint);

  }

  _updateHUD(dt) {
    if (!this._hudDirty) return;
    this._hudT += dt;
    if (this._hudT < 0.2) return;               /* DOM text at 5 Hz — never per-frame */
    this._hudT = 0;
    const el = this.el;
    if (!el) return;
    this._hudDirty = false;

    const hasState = this.data.hasState === true;
    for (let i = 0; i < this.R.length; i++) {
      const d = this.R[i].data, e = el.res[i];
      /* STAGE 12 — `ok` is true only when the BACKEND supplied a level. Nothing
       * is defaulted to a number and nothing is derived from other readouts. */
      const ok = !!(hasState && d && typeof d.level === 'number');
      e.level.textContent   = ok ? (d.level * 100).toFixed(1) + '%' : '--';
      e.storage.textContent = (ok && typeof d.storage === 'number') ? (d.storage * 100).toFixed(1) + '%' : '--';
      e.inflow.textContent  = (ok && typeof d.inflow === 'number') ? d.inflow.toFixed(1) + ' m³/s' : '--';
      e.release.textContent = (ok && typeof d.release === 'number') ? d.release.toFixed(1) + ' m³/s' : '--';
      e.gate.textContent    = (ok && typeof d.gate === 'number') ? (d.gate * 100).toFixed(0) + '%' : '--';
      e.barL.style.width    = ok ? (clamp01(d.level) * 100) + '%' : '0%';
      /* risk chip — backend string verbatim via RISK_UI (handles 'high risk' etc.) */
      const ru = riskUi(ok ? d.risk : null) || {cls:'unknown', label:'UNKNOWN'};
      e.risk.textContent = ok ? ru.label : 'NO DATA';
      e.risk.className = 'chip ' + (ok ? ru.cls : 'normal');
      /* STAGE 12 — the trend is the BACKEND's classification of the net flux.
       * The browser used to compute `inflow - release` here; it no longer does. */
      const tr = ok ? String(d.trend || '') : '';
      e.trend.textContent = tr === 'RISING' ? '▲ RISING'
                          : tr === 'FALLING' ? '▼ FALLING'
                          : tr === 'STEADY' ? '— STEADY' : '—';
      e.trend.style.color = tr === 'RISING' ? 'var(--warn)'
                          : tr === 'FALLING' ? 'var(--accent)' : 'var(--ink-faint)';
    }
    const s = this.storm.tgt;
    el.wint.textContent = hasState && this.data.stormIntensity !== null ? (s * 100).toFixed(0) + '%' : '--';
    el.wbar.style.width = hasState ? (s * 100) + '%' : '0%';
    /* STAGE 12 — the storm LEVEL is the backend's classification. */
    const lvl = this.data.stormLevel;
    el.wlevel.textContent = lvl || '--';
    el.wlevel.style.color = lvl === 'HEAVY' ? 'var(--warn)'
                          : lvl === 'SEVERE' ? 'var(--bad)'
                          : lvl ? 'var(--ok)' : 'var(--ink-faint)';
    /* STAGE 12 — the seven bars are a purely VISUAL interpolation of the
     * backend's three authoritative forecast horizons (days 1/3/7). The old
     * sine-of-the-render-clock fabrication is gone: no forecast value is
     * invented in the browser, and with no backend forecast the bars stay flat. */
    const fs = this.data.forecastSummary;
    const horizons = fs && fs.horizons ? fs.horizons : null;
    const fPts = [];
    if (horizons) {
      if (typeof horizons['1d'] === 'number' && isFinite(horizons['1d'])) fPts.push([1, horizons['1d']]);
      if (typeof horizons['3d'] === 'number' && isFinite(horizons['3d'])) fPts.push([3, horizons['3d']]);
      if (typeof horizons['7d'] === 'number' && isFinite(horizons['7d'])) fPts.push([7, horizons['7d']]);
    }
    const fPeak = fPts.length ? Math.max.apply(null, fPts.map(p => p[1])) : 0;
    for (let i = 0; i < this.fcBars.length; i++) {
      const day = i + 1;
      const v = visualInterpDay(day, fPts);
      const t = (fPeak > 0 && v !== null) ? clamp01(v / fPeak) : 0;
      this.fcBars[i].style.height = (3 + t * 23) + 'px';
      this.fcBars[i].style.opacity = fPts.length ? (0.3 + t * 0.7) : 0.15;
    }
    /* STAGE 12 — downstream flow, its AUTHORITATIVE limit and the severity all
     * come from the backend. The browser no longer owns a hardcoded safe limit
     * nor the flow thresholds that used to classify the severity itself. */
    const ds = this.data.downstream;
    const dsKnown = hasState && typeof ds === 'number';
    const st = hasState ? String(this.data.downstreamStatus || 'UNKNOWN') : 'UNKNOWN';
    const stColor = st === 'NORMAL' ? 'var(--ok)' : st === 'WARNING' ? 'var(--warn)'
                  : st === 'CRITICAL' ? 'var(--bad)' : 'var(--ink-faint)';
    if (el.operatorAlert) {
      const normalized = st.toUpperCase().replace(/[_-]+/g, ' ').trim();
      const severe = ['ALERT', 'HIGH RISK', 'DANGER', 'CRITICAL'].includes(normalized);
      const watch = ['WATCH', 'WARNING'].includes(normalized);
      el.operatorAlert.hidden = !hasState;
      el.operatorAlert.dataset.severity = severe ? 'critical' : 'watch';
      if (severe) {
        const notification = this.data.notification || {};
        const delivery = notification.status || 'NOT_CONFIGURED';
        const deliveryLabel = notification.error === 'Alert disabled in notification settings' ? 'EMAIL DISABLED'
          : ({PENDING:'EMAIL PENDING', SENT:'EMAIL SENT', FAILED:'EMAIL FAILED', NOT_CONFIGURED:'EMAIL NOT CONFIGURED'}[delivery] || 'EMAIL NOT CONFIGURED');
        el.operatorAlert.textContent = 'DOWNSTREAM · HIGH RISK · ' + deliveryLabel;
        const raw = this.data.rawState || {};
        const reason = Object.values(raw.reservoirs || {}).map(r => r.risk_reason).filter(Boolean).join('; ') || 'Not supplied by authoritative state';
        const source = (raw.forecast_source_selection || {}).selected || (raw.forecast_provenance || {}).live_path || 'UNKNOWN';
        const mode = raw.controller_mode || 'UNKNOWN';
        const incident = notification.incident_id || 'Pending incident evaluation';
        const recipient = notification.recipient || 'Not configured';
        const timestamp = notification.timestamp || '—';
        const forecastStatus = (raw.forecast_summary || {}).status || 'UNKNOWN';
        if (el.notificationDetail) el.notificationDetail.textContent = `DOWNSTREAM HIGH RISK\nRisk reason: ${reason}\nDownstream flow: ${dsKnown ? ds.toFixed(2) + ' m³/s' : '—'}\nCapacity: ${typeof this.data.downstreamCapacity === 'number' ? this.data.downstreamCapacity.toFixed(1) + ' m³/s' : '—'}\nMode: ${mode}\nSource: ${source}\nForecast status: ${forecastStatus}\nIncident: ${incident}\nNotification: ${delivery}\nTimestamp: ${timestamp}\nRecipient: ${recipient}\nDelivery detail: ${notification.error || '—'}`;
      } else if (watch) {
        el.operatorAlert.textContent = 'DOWNSTREAM · WARNING';
        if (el.notificationDetail) el.notificationDetail.hidden = true;
      } else if (st === 'NORMAL') {
        el.operatorAlert.textContent = 'DOWNSTREAM · SAFE';
        if (el.notificationDetail) el.notificationDetail.hidden = true;
      } else {
        el.operatorAlert.textContent = 'DOWNSTREAM · STATUS UNKNOWN';
        if (el.notificationDetail) el.notificationDetail.hidden = true;
      }
    }
    const util = (hasState && typeof this.data.downstreamUtil === 'number')
      ? clamp01(this.data.downstreamUtil) : 0;
    const capTxt = (hasState && typeof this.data.downstreamCapacity === 'number')
      ? this.data.downstreamCapacity.toFixed(1) + ' m³/s' : '--';
    el.dsval.textContent = dsKnown ? ds.toFixed(1) + ' m³/s' : '--';
    el.dsbar.style.width = (util * 100) + '%';
    el.dsstat.textContent = st;
    el.dsstat.style.color = stColor;
    if (el.dslimit) el.dslimit.textContent = capTxt;
    if (el.dslimit2) el.dslimit2.textContent = capTxt;
    /* downstream card in the bottom strip */
    el.dsval2.textContent = dsKnown ? ds.toFixed(1) + ' m³/s' : '--';
    el.dsbar2.style.width = (util * 100) + '%';
    el.dsstat2.textContent = st;
    el.dsstat2.className = 'chip ' + (st === 'NORMAL' ? 'normal' : st === 'WARNING' ? 'warning' : st === 'CRITICAL' ? 'danger' : 'normal');
    el.dsstat3.textContent = st;
    el.dsstat3.style.color = stColor;
    for (let i = 0; i < this.R.length; i++) {
      const rd = this.R[i].data;
      const ru = riskUi(rd && rd.risk ? rd.risk : null) || RISK_UI.normal;
      const known = hasState && rd && typeof rd.level === 'number';
      el.tn[i].className = 'tnode' + (!known ? '' : ru.cls === 'normal' ? '' : ' ' + ru.cls);
    }
    el.tn[4].className = 'tnode' + (st === 'NORMAL' ? '' : st === 'WARNING' ? ' warn' : st === 'CRITICAL' ? ' bad' : '');
    /* STAGE 12 — the authoritative state identity, displayed verbatim so the
     * operator can see the twin following the BACKEND's simulation progress. */
    if (el.stateid) el.stateid.textContent = hasState ? (this.data.stateId || '--') : '--';
    const modeTxt = !this.data.hasState ? '--'
                  : this.data.mode === 'MANUAL' ? 'MANUAL' : this.data.mode === 'AI' ? 'AUTO REQUESTED' : 'UNKNOWN';
    el.mode.textContent = modeTxt;
    el.mode2.textContent = modeTxt;

    /* Stage 7 — show the ACTUAL controller state, never a hopeful label. */
    const ctl = this.data.control || {};
    const cstatus = String(ctl.controller_status || 'UNKNOWN').toUpperCase();
    if (this.data.hasState && this.data.mode !== 'MANUAL') {
      const label = cstatus === 'ACTIVE' ? 'MPC · ACTIVE'
                  : cstatus === 'BLOCKED' ? 'MPC · BLOCKED'
                  : 'MPC · ' + cstatus;
      el.mode.textContent = label;
      el.mode2.textContent = label;
    }
    if (el.ctlstat) {
      el.ctlstat.textContent = ctl.forecast_control_eligible ? 'ELIGIBLE' : 'NOT ELIGIBLE';
      el.ctlstat.style.color = ctl.forecast_control_eligible ? 'var(--ok)' : 'var(--warn)';
    }
    if (el.safety) {
      const sstatus = String(ctl.safety_layer_status || 'UNKNOWN').replace(/_/g, ' ');
      el.safety.textContent = sstatus;
      el.safety.style.color = (ctl.safety_layer_status === 'SAFE') ? 'var(--ok)'
                            : (ctl.safety_layer_status === 'CORRECTED') ? 'var(--warn)'
                            : 'var(--ink-faint)';
    }
    if (el.safetymod) {
      /* Applied vs proposed — display only, never computed here. */
      el.safetymod.textContent = ctl.safety_modified ? 'MODIFIED'
                               : (ctl.control_applied ? 'UNCHANGED' : 'NOT APPLIED');
      el.safetymod.style.color = ctl.safety_modified ? 'var(--warn)' : 'var(--ink-faint)';
    }
    /* Stage 10 — DOWNSTREAM CAPACITY PROTECTION, reported SEPARATELY from the
     * MPC status and the SafetyLayer status. Nothing is derived here: the
     * status string, the predicted flow and the capacity all come from the
     * backend, so the UI can never claim protection the engine did not prove. */
    if (el.dsprot) {
      const dst = String(ctl.downstream_status || 'UNKNOWN');
      el.dsprot.textContent = dst.replace(/_/g, ' ');
      el.dsprot.style.color = dst === 'PROTECTED' ? 'var(--ok)'
                            : (dst === 'CORRECTED' || dst === 'FAILED_CLOSED')
                              ? 'var(--warn)' : 'var(--ink-faint)';
    }
    if (el.dsflow) {
      const cap = ctl.downstream_capacity_mcm_day;
      const flow = ctl.downstream_predicted_flow_mcm_day;
      if (typeof cap === 'number' && cap > 0 && typeof flow === 'number') {
        el.dsflow.textContent = flow.toFixed(1) + ' / ' + cap.toFixed(1) + ' MCM/d';
        el.dsflow.style.color = (ctl.downstream_capacity_achieved === true)
          ? 'var(--ok)' : 'var(--warn)';
      } else {
        el.dsflow.textContent = '--';
        el.dsflow.style.color = 'var(--ink-faint)';
      }
    }
    if (el.finalact) {
      /* The action that was actually written to the physics. */
      const src = String(ctl.final_safe_control_action_source || '');
      el.finalact.textContent = src === 'DOWNSTREAM_CAPACITY_GUARD'
        ? (ctl.downstream_protection_modified ? 'DOWNSTREAM-CORRECTED' : 'ALL CHECKS PASSED')
        : (src === 'HELD_CURRENT_GATES' ? 'HELD (NOT APPLIED)' : '--');
      el.finalact.style.color = src === 'DOWNSTREAM_CAPACITY_GUARD'
        ? (ctl.downstream_protection_modified ? 'var(--warn)' : 'var(--ok)')
        : 'var(--ink-faint)';
    }
    /* Stage 11 — LIVE MASS-BALANCE INTEGRITY, reported exactly as the backend
     * physics produced it. Nothing is derived here: the status string, the
     * residual, the tolerance and the number of reservoirs audited all come from
     * the payload. "PASS" is only ever shown when the backend says it actually
     * checked (`checked === true`). A NOT_CHECKED / VIOLATION state is never
     * upgraded by this UI. */
    const mb = this.data.massBalance || {};
    const mbStatus = String(mb.status || 'NOT_CHECKED');
    if (el.mbstat) {
      el.mbstat.textContent = mbStatus.replace(/_/g, ' ');
      el.mbstat.style.color = (mbStatus === 'PASS' && mb.checked === true) ? 'var(--ok)'
                            : (mbStatus === 'VIOLATION') ? 'var(--bad)'
                            : 'var(--ink-faint)';
    }
    if (el.mbres) {
      const r = mb.residual, t = mb.tolerance;
      if (mb.checked === true && typeof r === 'number' && typeof t === 'number') {
        el.mbres.textContent = r.toExponential(2) + ' / ' + t.toExponential(0)
                             + ' ' + String(mb.unit || 'MCM');
        el.mbres.style.color = (mbStatus === 'PASS') ? 'var(--ok)' : 'var(--bad)';
      } else {
        el.mbres.textContent = '--';
        el.mbres.style.color = 'var(--ink-faint)';
      }
    }
    if (el.mbchk) {
      el.mbchk.textContent = (mb.checked === true) ? 'YES' : 'NO';
      el.mbchk.style.color = (mb.checked === true) ? 'var(--ink)' : 'var(--warn)';
    }
    if (el.mbres4) {
      const n = mb.reservoirs_checked;
      el.mbres4.textContent = (typeof n === 'number') ? (n + ' CHECKED') : '--';
      el.mbres4.style.color = (typeof n === 'number' && n >= 4) ? 'var(--ok)'
                            : 'var(--ink-faint)';
    }
    /* Stage 14 — GNN ADVISORY (spatial dependency representation).
     *
     * DISPLAY ONLY. Every value below is printed from the authoritative payload.
     * This page does NOT run the GNN, does NOT compute an embedding, does NOT
     * compute a similarity and does NOT derive a relationship. `advisory_only`
     * and `affects_control` are read from the payload rather than asserted here,
     * so what the operator sees cannot drift from what the backend reports.
     * The similarity shown is an EMBEDDING SIMILARITY between learned vectors —
     * never hydraulic, causal or physical connectivity. */
    const ga = this.data.gnnAdvisory || {};
    setText(this.hudRoot.querySelector('[data-ref="gnn-boundary"]'),
      'Advisory only: ' + (typeof ga.advisory_only === 'boolean' ? (ga.advisory_only ? 'YES' : 'NO') : 'UNKNOWN')
      + ' · Affects control: ' + (typeof ga.affects_control === 'boolean' ? (ga.affects_control ? 'YES' : 'NO') : 'UNKNOWN'));
    const gaStatus = String(ga.status || 'UNAVAILABLE');
    if (el.fceng) {
      /* The forecast engine is named by the payload. It was previously a
       * hardcoded "LSTM V3 + GNN", which implied the experimental GNN was part
       * of the forecast path. It is not: the validated frozen LSTM V3 produces
       * the control forecast and the GNN is advisory only. */
      const fp = this.data.forecastProvenance || {};
      const model = String(fp.model || '');
      const selection = this.data.forecastSourceSelection;
      el.fceng.textContent = selection && selection.selected
        ? selection.selected.replace(/_/g, ' ') : (model.startsWith('LSTM_V3') ? 'LSTM V3' : (model || '--'));
      el.fceng.style.color = 'var(--ink-faint)';
    }
    if (el.gnnstat) {
      if (this.data.hasState && ga.advisory_only === true) {
        el.gnnstat.textContent = gaStatus.replace(/_/g, ' ');
        el.gnnstat.style.color = (gaStatus === 'AVAILABLE') ? 'var(--ink)'
                               : (gaStatus === 'WARMUP_INSUFFICIENT_HISTORY') ? 'var(--warn)'
                               : 'var(--ink-faint)';
      } else {
        el.gnnstat.textContent = '--';
        el.gnnstat.style.color = 'var(--ink-faint)';
      }
      el.gnnstat.title = 'Advisory only — affects control: '
        + String(ga.affects_control === true);
    }
    if (el.gnngraph) {
      const gn = ga.graph_nodes, ge = ga.graph_undirected_edges;
      el.gnngraph.textContent = (typeof gn === 'number' && typeof ge === 'number')
        ? (gn + 'N / ' + ge + 'E') : '--';
      el.gnngraph.style.color = 'var(--ink-faint)';
    }
    if (el.gnnrel) {
      const sim = ga.embedding_similarity || null;
      const top = (sim && Array.isArray(sim.top_relationships)) ? sim.top_relationships[0] : null;
      if (top && typeof top.embedding_similarity === 'number') {
        el.gnnrel.textContent = top.source + '\u2194' + top.target
          + ' ' + top.embedding_similarity.toFixed(2);
        el.gnnrel.title = String(sim.label || '') + ' — ' + String(sim.matrix_note || '');
      } else {
        el.gnnrel.textContent = '--';
        el.gnnrel.title = '';
      }
      el.gnnrel.style.color = 'var(--ink-faint)';
    }
    /* Stage 9 — coordination provenance, straight from the backend.
     * RESERVOIRS : how many reservoirs the authoritative cascade declares.
     * MPC ACTION : the dimensionality of the action vector the MPC searched and
     *              how many complete candidate vectors it scored. Both are
     *              reported by the backend; nothing is counted in JS. */
    if (el.rescount) {
      const c = this.data.cascade;
      el.rescount.textContent = (c && c.count) ? (c.count + ' RESERVOIRS') : '--';
      el.rescount.style.color = (c && c.count >= 4) ? 'var(--ok)' : 'var(--warn)';
    }
    if (el.actdim) {
      const as = ctl.action_space || {};
      if (as.dimension) {
        el.actdim.textContent = as.dimension + 'D · ' + (as.candidate_vectors || 0) + ' VECTORS';
        el.actdim.style.color = (as.dimension >= 4 && as.coordinated) ? 'var(--ok)' : 'var(--warn)';
      } else {
        el.actdim.textContent = '--';
        el.actdim.style.color = 'var(--ink-faint)';
      }
    }
    /* STAGE 12 — the run state is the BACKEND's, not a hardcoded label. */
    const runTxt = this.data.running === true ? 'RUNNING'
                 : this.data.running === false ? 'PAUSED' : '--';
    el.hstat.textContent = runTxt;
    el.simstat.textContent = runTxt;
    const t = new Date(this.data.simTime);
    el.liveTime.textContent = isFinite(t.getTime())
      ? t.toLocaleTimeString('en-GB') + ' · ' + t.toLocaleDateString('en-GB')
      : String(this.data.simTime);
    el.liveWx.textContent = lvl || '--';
    const hwKeys = ['esp32', 'water_level_sensor', 'flow_sensor', 'gate_actuator'];
    for (let i = 0; i < 4; i++) {
      el.hw[i].textContent = String(this.data.hardware[hwKeys[i]] || 'NOT_CONNECTED')
        .toUpperCase().replace(/_/g, ' ');
    }
  }
}

/* ================= bootstrap — one init per page load ================= */
/* TestDriver REMOVED — Python simulation state is the sole input via postMessage. */
const root = document.getElementById('twin-root');
let app = null;
try {
  app = new ReservoirTwinRenderer(root, { testControls: true });
} catch (e) {
  console.error("Renderer initialization failed:", e);
  /* boot overlay already shows the failure reason; nothing further to do */
}
if (app) {
  /* STAGE 12 — NO console state-push handle.
   *
   * The renderer used to be exposed on `window` with a documented usage of
   * pushing a state object straight into the twin, i.e. any script on the page
   * (or the console) could inject arbitrary reservoir state. That is a
   * client-side state-injection path, so it is GONE. The page now publishes a
   * read-only readiness flag (used by the boot watchdog) and nothing else.
   *
   * The twin is driven ONLY by the authoritative `/ws/state` feed. */
  window.__twinReady = true;
  window.ReservoirTwinRenderer = ReservoirTwinRenderer;

  /* Theme: init toggle + apply 3D mood for the active theme (presentation only) */
  ThemeManager.init();
  ThemeManager.onChange(theme => { if (app) app.applyTheme3D(theme); });
  app.applyTheme3D(ThemeManager.current);

  /* Initialize API connection */
  const api = new TwinAPI((state) => {
    app.updateState(state);
  }, status => {
    if (app.connectionStatus !== status) app._hudDirty = true;
    app.connectionStatus = status;
    const connection = document.querySelector('[data-ref="connection"]');
    setText(connection, status === 'CONNECTED' ? 'BACKEND VERIFIED' : status === 'STALE DATA' ? status : status === 'CONNECTING' ? 'VERIFYING BACKEND' : 'BACKEND DISCONNECTED');
    setStatus(connection, status);
  }, status => {
    document.querySelector('[data-ref="command-feedback"]').textContent = status;
  }, health => {
    const put = (key, value) => { const target = document.querySelector(`[data-ref="${key}"]`); if (target) target.textContent = value; };
    put('rest-health', health.rest);
    put('ws-health', health.websocket);
    put('state-health', health.state);
    put('state-received', health.receivedAt ? `ID ${health.stateId} at ${new Date(health.receivedAt).toLocaleTimeString()}` : 'NO STATE YET');
  });
  window.__twin_api = api;
  Object.defineProperty(window, '__twinDiagnostics', {get: () => ({
    fps: app._fps, frameMs: app._fps ? 1000 / app._fps : null,
    connection: app.connectionStatus, stateId: app.data.stateId,
    camera: app.camera.position.toArray(), target: app.controls.target.toArray(),
    memory: {...app.renderer.info.memory}, drawCalls: app.renderer.info.render.calls,
    triangles: app.renderer.info.render.triangles,
    rendering:{quality:app.visualQuality,pixelRatio:app.renderer.getPixelRatio(),devicePixelRatio:window.devicePixelRatio,
      canvas:[app.renderer.domElement.width,app.renderer.domElement.height],
      shadowMaps:1,shadowSize:app.sun.shadow.mapSize.toArray(),shadowAutoUpdate:app.renderer.shadowMap.autoUpdate,
      requestedGpuMode:app.renderer.getContext().getContextAttributes().powerPreference,
      webgl:app.renderer.getContext().getParameter(app.renderer.getContext().VERSION)},
    reservoirs: app.R.map(r => ({id:r.B.id, level:r.data.level, gate:r.data.gate,
      waterY:r.waterMesh.position.y, gateY:r.gateMesh.position.y,
      gateTargetY:r.gateClosedY + r.gateTgt * r.gateTravel,
      waterVisible:r.waterMesh.visible, jetVisible:r.jetMesh.visible,
      spillVisible:r.spillMesh.visible, basin:{...r.B}})),
    channels: app.flowMeshes.map(f => ({key:f.key, flow:f.mat.uniforms.uFlow.value,visible:f.mesh.visible,
      foamPhase:f.foamPhase, pathLength:f.pathLength,
      screenPath:Array.from({length:17},(_,i)=>{
        const p=f.mesh.geometry.attributes.position;
        const n=Math.min(p.count-2,Math.floor(i/16*(p.count/2-1))*2);
        const point=new THREE.Vector3((p.getX(n)+p.getX(n+1))/2,p.getY(n),(p.getZ(n)+p.getZ(n+1))/2).project(app.camera);
        const rect=app.renderer.domElement.getBoundingClientRect();
        return [rect.left+(point.x*.5+.5)*rect.width,rect.top+(-point.y*.5+.5)*rect.height];
      })})),
    objects: app.scene.children.map(o=>o.name).filter(Boolean)
  })});

  /* Bind Simulation Controls */
  const bindEvent = (selector, eventName, handler) => {
    const el = document.querySelector(selector);
    if (el) el.addEventListener(eventName, handler);
  };
  const bindClick = (selector, handler) => bindEvent(selector, 'click', handler);
  const bindChange = (selector, handler) => bindEvent(selector, 'change', handler);
  const bindInput = (selector, labelSelector, handler) => {
    const el = document.querySelector(selector);
    const label = document.querySelector(labelSelector);
    if (el) {
      el.addEventListener('input', (e) => {
        if (label) label.textContent = e.target.value;
        handler(e);
      });
    }
  };

  document.querySelectorAll('[data-demo]').forEach(btn => btn.addEventListener('click', async () => {
    const step = btn.dataset.demo;
    if (step === 'normal') {
      await api.pause(); await api.reset(); await api.setMode('MANUAL'); await api.setStorm(0); await api.step();
    } else if (step === 'return') {
      await api.setMode('MANUAL'); await api.setStorm(20);
    } else if (step === 'rain') await api.setStorm(35);
    else await api.setMode('AI');
  }));
  bindClick('#btn-play', () => api.play());
  bindClick('#btn-pause', () => api.pause());
  bindClick('#btn-step', () => api.step());
  bindClick('#btn-reset', async () => {
    await api.pause(); await api.reset();
    await api.setMode('MANUAL'); await api.setStorm(0);
  });
  
  bindInput('#ctl-speed', '#v-speed', (e) => api.setSpeed(Number(e.target.value) / 100));
  bindInput('[data-ctl="storm"]', '[data-v="storm"]', (e) => api.setStorm(Number(e.target.value)));
  
  for (let i = 1; i <= 4; i++) {
    bindInput(`[data-ctl="g${i}"]`, `[data-v="g${i}"]`, (e) => api.setGate(`reservoir_${i}`, Number(e.target.value)));
  }
  
  bindChange('[data-ctl="auto"]', (e) => api.setMode(e.target.checked ? 'AI' : 'MANUAL'));

  /* ── STAGE 18 — CONTROL MODE (MANUAL | AUTO) ────────────────────────────────
   * The switch only ISSUES the command. What the twin displays afterwards comes
   * from the backend's own `auto_control` block, so the UI can never show AUTO
   * as active when the backend is not in AI mode. */
  document.querySelectorAll('#ctl-mode [data-mode]').forEach(btn => {
    btn.addEventListener('click', () => {
      api.setMode(btn.dataset.mode === 'AUTO' ? 'AI' : 'MANUAL');
    });
  });

  /* ── STAGE 18 — AI FORECAST SOURCE ──────────────────────────────────────────
   * Selects which REAL forecast source is offered to the controller. This never
   * relaxes the provenance gate; it is the backend that decides whether the
   * gate is satisfied. */
  document.querySelectorAll('#ctl-source [data-source]').forEach(btn => {
    btn.addEventListener('click', () => api.setMode(btn.dataset.mode, btn.dataset.source));
  });
}
</script>
</body>
</html>
