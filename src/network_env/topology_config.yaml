# =============================================================================
# Phase 15.1 — Four-Reservoir Prototype Network Configuration
# =============================================================================
#
# This file defines the CANONICAL interconnected reservoir network
# for the AI-Based Multi-Reservoir Water Management System prototype.
#
# IMPORTANT PROVENANCE NOTICE:
#   Parameters marked OBSERVED or VERIFIED are supported by repository
#   evidence (e.g., maximum observed live_storage in the cleaned dataset).
#   Parameters marked ASSUMED_FOR_PROTOTYPE are chosen for the prototype
#   demonstration and must NOT be presented as verified Kerala dam data.
#
# The four-reservoir linear cascade A → B → C → D does NOT represent
# verified physical connectivity of real Kerala reservoirs.
#
# To add or remove reservoirs, edit the "reservoirs" and "connections"
# sections below.  No Python source code changes are required.
# =============================================================================

# --- Reservoir Nodes ---
reservoirs:
