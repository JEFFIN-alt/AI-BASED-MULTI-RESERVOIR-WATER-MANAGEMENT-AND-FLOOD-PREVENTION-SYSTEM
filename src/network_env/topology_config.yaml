# --- Directed Connections ---
connections:
  - source: "Reservoir_A"
    destination: "Reservoir_B"
    routing_delay_days:
      value: 2
      provenance: "ASSUMED_FOR_PROTOTYPE"
      source: "Hypothetical 2-day travel time for prototype cascade"
    attenuation_factor:
      value: 0.90
      provenance: "ASSUMED_FOR_PROTOTYPE"
      source: "Assumed 10% transmission loss during routing for prototype"

  - source: "Reservoir_B"
    destination: "Reservoir_C"
    routing_delay_days:
      value: 1
      provenance: "ASSUMED_FOR_PROTOTYPE"
      source: "Hypothetical 1-day travel time for prototype cascade"
    attenuation_factor:
      value: 0.85
      provenance: "ASSUMED_FOR_PROTOTYPE"
