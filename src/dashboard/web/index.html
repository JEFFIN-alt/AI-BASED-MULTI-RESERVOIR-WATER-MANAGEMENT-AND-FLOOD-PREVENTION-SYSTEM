  _cachePanelAnchors() {
    if (!this.el) return;
    this.panelAnchors = this.el.res.map((re, i) => {
      const rect = re.panel.getBoundingClientRect();
      return { x: i === 0 ? rect.right : rect.left, y: rect.top + rect.height / 2 };
    });
  }

  _updateConnectors() {
    if (!this.connLines || !this.panelAnchors) return;
    const w = this.container.clientWidth, h = this.container.clientHeight;
    /* floating label anchor points: R1/R2/R3 above their basins, DS at the downstream pool */
    const DS_POS = { x: 40, y: -25, z: 520 };
    const labelWorld = [
      ...this.R.map(r => ({ x: valleyCenterX(r.B.cz), y: (r.waterY || r.minY) + 42, z: r.B.cz })),
      DS_POS,
    ];
    for (let i = 0; i < 4; i++) {
      const lw = labelWorld[i];
      this._v3.set(lw.x, lw.y, lw.z).project(this.camera);
      const label = this.fLabels[i];
      const line = this.connLines[i], dot = this.connDots[i];
      if (this._v3.z > 1 || this._v3.z < -1) {
        if (label) label.style.opacity = '0';
        if (line) line.style.display = 'none';
        if (dot) dot.style.display = 'none';
        continue;
      }
      const sx = (this._v3.x * 0.5 + 0.5) * w, sy = (-this._v3.y * 0.5 + 0.5) * h;
      if (label) {
        label.style.opacity = '1';
        label.style.left = sx + 'px';
        label.style.top = sy + 'px';
        if (this.el && this.el.flLvl[i]) {
          const d = i < 3 ? this.R[i].data : null;
          const dOk = !!(this.data.hasState && d && typeof d.level === 'number');
          this.el.flLvl[i].textContent = dOk ? (d.level * 100).toFixed(0) + '%'
            : (i === 3 && typeof this.data.downstream === 'number'
               ? this.data.downstream.toFixed(0) + ' m³/s' : '--');
          if (dOk) {
            /* gate % — reservoirs only */
            if (this.el.flGate[i]) this.el.flGate[i].textContent = (d.gate * 100).toFixed(0) + '%';
            /* risk chip + label tint — backend string verbatim via RISK_UI */
            const ru = riskUi(d.risk) || RISK_UI.normal;
            if (this.el.flRisk[i]) {
              this.el.flRisk[i].textContent = ru.label;
              this.el.flRisk[i].className = 'fl-risk chip ' + ru.cls;
            }
            label.className = 'flabel r-' + ru.cls;
          } else {
            /* STAGE 12 — DS label. The severity string is the BACKEND's; the
             * browser no longer applies its own flow thresholds. */
            const dst = this.data.hasState ? String(this.data.downstreamStatus || 'UNKNOWN') : 'UNKNOWN';
            const ru = dst === 'WARNING' ? RISK_UI.warning
                     : dst === 'CRITICAL' ? RISK_UI.danger
                     : dst === 'NORMAL' ? RISK_UI.normal : RISK_UI.normal;
            if (this.el.flRisk[i]) {
              this.el.flRisk[i].textContent = ru.label;
              this.el.flRisk[i].className = 'fl-risk chip ' + ru.cls;
            }
            label.className = 'flabel r-' + ru.cls;
          }
        }
      }
      if (i < 3) {
        const a = this.panelAnchors[i];
        line.style.display = '';
        dot.style.display = '';
        line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
        line.setAttribute('x2', sx); line.setAttribute('y2', sy);
        dot.setAttribute('cx', sx); dot.setAttribute('cy', sy);
        /* risk-tinted connector line + dot */
        const ru = riskUi(this.R[i].data.risk) || RISK_UI.normal;
        const tint = ru.cls === 'normal' ? 'var(--accent-line)' :
          ru.cls === 'watch' || ru.cls === 'warning' ? 'var(--warn)' :
          ru.cls === 'alert' ? 'var(--alert)' : 'var(--bad)';
        line.style.stroke = tint;
        dot.setAttribute('stroke', ru.cls === 'normal' ? 'var(--accent)' : tint);
      }
    }
  }

  _updateHUD(dt) {
    this._hudT += dt;
    if (this._hudT < 0.2) return;               /* DOM text at 5 Hz — never per-frame */
    this._hudT = 0;
    const el = this.el;
    if (!el) return;

    const hasState = this.data.hasState === true;
    for (let i = 0; i < 3; i++) {
      const d = this.R[i].data, e = el.res[i];
      /* STAGE 12 — `ok` is true only when the BACKEND supplied a level. Nothing
       * is defaulted to a number and nothing is derived from other readouts. */
      const ok = !!(hasState && d && typeof d.level === 'number');
      e.level.textContent   = ok ? (d.level * 100).toFixed(1) + '%' : '--';
      e.storage.textContent = (ok && typeof d.storage === 'number') ? (d.storage * 100).toFixed(1) + '%' : '--';
      e.inflow.textContent  = (ok && typeof d.inflow === 'number') ? d.inflow.toFixed(1) + ' m³/s' : '--';
      e.release.textContent = (ok && typeof d.release === 'number') ? d.release.toFixed(1) + ' m³/s' : '--';
      e.gate.textContent    = (ok && typeof d.gate === 'number') ? (d.gate * 100).toFixed(0) + '%' : '--';
      e.barL.style.width    = ok ? (clamp01(d.level) * 100) + '%' : '0%';
      /* risk chip — backend string verbatim via RISK_UI (handles 'high risk' etc.) */
      const ru = riskUi(ok ? d.risk : null) || RISK_UI.normal;
      e.risk.textContent = ok ? ru.label : 'NO DATA';
      e.risk.className = 'chip ' + (ok ? ru.cls : 'normal');
      /* STAGE 12 — the trend is the BACKEND's classification of the net flux.
       * The browser used to compute `inflow - release` here; it no longer does. */
      const tr = ok ? String(d.trend || '') : '';
      e.trend.textContent = tr === 'RISING' ? '▲ RISING'
                          : tr === 'FALLING' ? '▼ FALLING'
                          : tr === 'STEADY' ? '— STEADY' : '—';
      e.trend.style.color = tr === 'RISING' ? 'var(--warn)'
                          : tr === 'FALLING' ? 'var(--accent)' : 'var(--ink-faint)';
    }
    const s = this.storm.cur;
    el.wint.textContent = hasState ? (s * 100).toFixed(0) + '%' : '--';
    el.wbar.style.width = hasState ? (s * 100) + '%' : '0%';
    /* STAGE 12 — the storm LEVEL is the backend's classification. */
    const lvl = this.data.stormLevel;
    el.wlevel.textContent = lvl || '--';
    el.wlevel.style.color = lvl === 'HEAVY' ? 'var(--warn)'
                          : lvl === 'SEVERE' ? 'var(--bad)'
                          : lvl ? 'var(--ok)' : 'var(--ink-faint)';
    /* STAGE 12 — the seven bars are a purely VISUAL interpolation of the
     * backend's three authoritative forecast horizons (days 1/3/7). The old
     * sine-of-the-render-clock fabrication is gone: no forecast value is
     * invented in the browser, and with no backend forecast the bars stay flat. */
    const fs = this.data.forecastSummary;
    const horizons = fs && fs.horizons ? fs.horizons : null;
    const fPts = [];
    if (horizons) {
      if (typeof horizons['1d'] === 'number' && isFinite(horizons['1d'])) fPts.push([1, horizons['1d']]);
      if (typeof horizons['3d'] === 'number' && isFinite(horizons['3d'])) fPts.push([3, horizons['3d']]);
      if (typeof horizons['7d'] === 'number' && isFinite(horizons['7d'])) fPts.push([7, horizons['7d']]);
    }
    const fPeak = fPts.length ? Math.max.apply(null, fPts.map(p => p[1])) : 0;
    for (let i = 0; i < this.fcBars.length; i++) {
      const day = i + 1;
      const v = visualInterpDay(day, fPts);
      const t = (fPeak > 0 && v !== null) ? clamp01(v / fPeak) : 0;
      this.fcBars[i].style.height = (3 + t * 23) + 'px';
      this.fcBars[i].style.opacity = fPts.length ? (0.3 + t * 0.7) : 0.15;
    }
    /* STAGE 12 — downstream flow, its AUTHORITATIVE limit and the severity all
     * come from the backend. The browser no longer owns a hardcoded safe limit
     * nor the flow thresholds that used to classify the severity itself. */
    const ds = this.data.downstream;
    const dsKnown = hasState && typeof ds === 'number';
    const st = hasState ? String(this.data.downstreamStatus || 'UNKNOWN') : 'UNKNOWN';
    const stColor = st === 'NORMAL' ? 'var(--ok)' : st === 'WARNING' ? 'var(--warn)'
                  : st === 'CRITICAL' ? 'var(--bad)' : 'var(--ink-faint)';
    const util = (hasState && typeof this.data.downstreamUtil === 'number')
      ? clamp01(this.data.downstreamUtil) : 0;
    const capTxt = (hasState && typeof this.data.downstreamCapacity === 'number')
      ? this.data.downstreamCapacity.toFixed(1) + ' m³/s' : '--';
    el.dsval.textContent = dsKnown ? ds.toFixed(1) + ' m³/s' : '--';
    el.dsbar.style.width = (util * 100) + '%';
    el.dsstat.textContent = st;
    el.dsstat.style.color = stColor;
    if (el.dslimit) el.dslimit.textContent = capTxt;
    if (el.dslimit2) el.dslimit2.textContent = capTxt;
    /* downstream card in the bottom strip */
    el.dsval2.textContent = dsKnown ? ds.toFixed(1) + ' m³/s' : '--';
    el.dsbar2.style.width = (util * 100) + '%';
    el.dsstat2.textContent = st;
    el.dsstat2.className = 'chip ' + (st === 'NORMAL' ? 'normal' : st === 'WARNING' ? 'warning' : st === 'CRITICAL' ? 'danger' : 'normal');
    el.dsstat3.textContent = st;
    el.dsstat3.style.color = stColor;
    /* Stage 9 — the FOURTH reservoir card (Reservoir D / Idukki).
     * Only the three basins above have a 3D mesh, so this card is fed from the
     * payload's reservoir_4 block rather than from this.R. */
    if (el.res[3]) {
      const e4 = el.res[3], d4 = this.data.reservoir4;
      if (d4) {
        e4.level.textContent = (d4.level * 100).toFixed(1) + '%';
        e4.storage.textContent = (d4.storage * 100).toFixed(1) + '%';
        e4.inflow.textContent = d4.inflow.toFixed(1) + ' m³/s';
        e4.release.textContent = d4.release.toFixed(1) + ' m³/s';
        e4.gate.textContent = (d4.gate * 100).toFixed(0) + '%';
        e4.barL.style.width = (d4.level * 100) + '%';
        const ru4 = riskUi(d4.risk) || RISK_UI.normal;
        e4.risk.textContent = ru4.label;
        e4.risk.className = 'chip ' + ru4.cls;
        /* STAGE 12 — backend trend verdict (was computed from inflow - release) */
        const tr4 = String(d4.trend || '');
        e4.trend.textContent = tr4 === 'RISING' ? '▲ RISING'
                             : tr4 === 'FALLING' ? '▼ FALLING'
                             : tr4 === 'STEADY' ? '— STEADY' : '—';
        e4.trend.style.color = tr4 === 'RISING' ? 'var(--warn)'
                             : tr4 === 'FALLING' ? 'var(--accent)' : 'var(--ink-faint)';
      } else {
        e4.level.textContent = '--'; e4.storage.textContent = '--';
        e4.inflow.textContent = '--'; e4.release.textContent = '--';
        e4.gate.textContent = '--'; e4.trend.textContent = '—';
        e4.risk.textContent = 'NO DATA'; e4.risk.className = 'chip normal';
        e4.barL.style.width = '0%';
      }
    }
    for (let i = 0; i < 3; i++) {
      const rd = this.R[i].data;
      const ru = riskUi(rd && rd.risk ? rd.risk : null) || RISK_UI.normal;
      const known = hasState && rd && typeof rd.level === 'number';
      el.tn[i].className = 'tnode' + (!known ? '' : ru.cls === 'normal' ? '' : ' ' + ru.cls);
    }
    /* R4 node — risk comes VERBATIM from the payload for Reservoir D. */
    const ru4 = riskUi((this.data.reservoir4 && this.data.reservoir4.risk) || 'normal') || RISK_UI.normal;
    el.tn[3].className = 'tnode' + (ru4.cls === 'normal' ? '' : ' ' + ru4.cls);
    el.tn[4].className = 'tnode' + (st === 'NORMAL' ? '' : st === 'WARNING' ? ' warn' : st === 'CRITICAL' ? ' bad' : '');
    /* STAGE 12 — the authoritative state identity, displayed verbatim so the
     * operator can see the twin following the BACKEND's simulation progress. */
    if (el.stateid) el.stateid.textContent = hasState ? (this.data.stateId || '--') : '--';
    const modeTxt = !this.data.hasState ? '--'
                  : this.data.mode === 'MANUAL' ? 'MANUAL' : 'AI / MPC';
    el.mode.textContent = modeTxt;
    el.mode2.textContent = modeTxt;

    /* Stage 7 — show the ACTUAL controller state, never a hopeful label. */
    const ctl = this.data.control || {};
    const cstatus = String(ctl.controller_status || 'UNKNOWN').toUpperCase();
    if (this.data.hasState && this.data.mode !== 'MANUAL') {
      const label = cstatus === 'ACTIVE' ? 'MPC · ACTIVE'
                  : cstatus === 'BLOCKED' ? 'MPC · BLOCKED'
                  : 'MPC · ' + cstatus;
      el.mode.textContent = label;
      el.mode2.textContent = label;
    }
    if (el.ctlstat) {
      el.ctlstat.textContent = ctl.forecast_control_eligible ? 'ELIGIBLE' : 'NOT ELIGIBLE';
      el.ctlstat.style.color = ctl.forecast_control_eligible ? 'var(--ok)' : 'var(--warn)';
    }
    if (el.safety) {
      const sstatus = String(ctl.safety_layer_status || 'UNKNOWN').replace(/_/g, ' ');
      el.safety.textContent = sstatus;
      el.safety.style.color = (ctl.safety_layer_status === 'SAFE') ? 'var(--ok)'
                            : (ctl.safety_layer_status === 'CORRECTED') ? 'var(--warn)'
                            : 'var(--ink-faint)';
    }
    if (el.safetymod) {
      /* Applied vs proposed — display only, never computed here. */
      el.safetymod.textContent = ctl.safety_modified ? 'MODIFIED'
                               : (ctl.control_applied ? 'UNCHANGED' : 'NOT APPLIED');
      el.safetymod.style.color = ctl.safety_modified ? 'var(--warn)' : 'var(--ink-faint)';
    }
    /* Stage 10 — DOWNSTREAM CAPACITY PROTECTION, reported SEPARATELY from the
     * MPC status and the SafetyLayer status. Nothing is derived here: the
     * status string, the predicted flow and the capacity all come from the
     * backend, so the UI can never claim protection the engine did not prove. */
    if (el.dsprot) {
      const dst = String(ctl.downstream_status || 'UNKNOWN');
      el.dsprot.textContent = dst.replace(/_/g, ' ');
      el.dsprot.style.color = dst === 'PROTECTED' ? 'var(--ok)'
                            : (dst === 'CORRECTED' || dst === 'FAILED_CLOSED')
                              ? 'var(--warn)' : 'var(--ink-faint)';
    }
    if (el.dsflow) {
      const cap = ctl.downstream_capacity_mcm_day;
      const flow = ctl.downstream_predicted_flow_mcm_day;
      if (typeof cap === 'number' && cap > 0 && typeof flow === 'number') {
        el.dsflow.textContent = flow.toFixed(1) + ' / ' + cap.toFixed(1) + ' MCM/d';
        el.dsflow.style.color = (ctl.downstream_capacity_achieved === true)
          ? 'var(--ok)' : 'var(--warn)';
      } else {
        el.dsflow.textContent = '--';
        el.dsflow.style.color = 'var(--ink-faint)';
      }
    }
    if (el.finalact) {
      /* The action that was actually written to the physics. */
      const src = String(ctl.final_safe_control_action_source || '');
      el.finalact.textContent = src === 'DOWNSTREAM_CAPACITY_GUARD'
        ? (ctl.downstream_protection_modified ? 'DOWNSTREAM-CORRECTED' : 'ALL CHECKS PASSED')
        : (src === 'HELD_CURRENT_GATES' ? 'HELD (NOT APPLIED)' : '--');
      el.finalact.style.color = src === 'DOWNSTREAM_CAPACITY_GUARD'
        ? (ctl.downstream_protection_modified ? 'var(--warn)' : 'var(--ok)')
        : 'var(--ink-faint)';
    }
    /* Stage 11 — LIVE MASS-BALANCE INTEGRITY, reported exactly as the backend
     * physics produced it. Nothing is derived here: the status string, the
     * residual, the tolerance and the number of reservoirs audited all come from
     * the payload. "PASS" is only ever shown when the backend says it actually
     * checked (`checked === true`). A NOT_CHECKED / VIOLATION state is never
     * upgraded by this UI. */
    const mb = this.data.massBalance || {};
    const mbStatus = String(mb.status || 'NOT_CHECKED');
    if (el.mbstat) {
      el.mbstat.textContent = mbStatus.replace(/_/g, ' ');
      el.mbstat.style.color = (mbStatus === 'PASS' && mb.checked === true) ? 'var(--ok)'
                            : (mbStatus === 'VIOLATION') ? 'var(--bad)'
                            : 'var(--ink-faint)';
    }
    if (el.mbres) {
      const r = mb.residual, t = mb.tolerance;
      if (mb.checked === true && typeof r === 'number' && typeof t === 'number') {
        el.mbres.textContent = r.toExponential(2) + ' / ' + t.toExponential(0)
                             + ' ' + String(mb.unit || 'MCM');
        el.mbres.style.color = (mbStatus === 'PASS') ? 'var(--ok)' : 'var(--bad)';
      } else {
        el.mbres.textContent = '--';
        el.mbres.style.color = 'var(--ink-faint)';
      }
    }
    if (el.mbchk) {
      el.mbchk.textContent = (mb.checked === true) ? 'YES' : 'NO';
      el.mbchk.style.color = (mb.checked === true) ? 'var(--ink)' : 'var(--warn)';
    }
    if (el.mbres4) {
      const n = mb.reservoirs_checked;
      el.mbres4.textContent = (typeof n === 'number') ? (n + ' CHECKED') : '--';
      el.mbres4.style.color = (typeof n === 'number' && n >= 4) ? 'var(--ok)'
                            : 'var(--ink-faint)';
    }
    /* Stage 9 — coordination provenance, straight from the backend.
     * RESERVOIRS : how many reservoirs the authoritative cascade declares.
     * MPC ACTION : the dimensionality of the action vector the MPC searched and
     *              how many complete candidate vectors it scored. Both are
     *              reported by the backend; nothing is counted in JS. */
    if (el.rescount) {
      const c = this.data.cascade;
      el.rescount.textContent = (c && c.count) ? (c.count + ' RESERVOIRS') : '--';
      el.rescount.style.color = (c && c.count >= 4) ? 'var(--ok)' : 'var(--warn)';
    }
    if (el.actdim) {
      const as = ctl.action_space || {};
      if (as.dimension) {
        el.actdim.textContent = as.dimension + 'D · ' + (as.candidate_vectors || 0) + ' VECTORS';
        el.actdim.style.color = (as.dimension >= 4 && as.coordinated) ? 'var(--ok)' : 'var(--warn)';
      } else {
        el.actdim.textContent = '--';
        el.actdim.style.color = 'var(--ink-faint)';
      }
    }
    /* STAGE 12 — the run state is the BACKEND's, not a hardcoded label. */
    const runTxt = this.data.running === true ? 'RUNNING'
                 : this.data.running === false ? 'PAUSED' : '--';
    el.hstat.textContent = runTxt;
    el.simstat.textContent = runTxt;
    const t = new Date(this.data.simTime);
    el.liveTime.textContent = isFinite(t.getTime())
      ? t.toLocaleTimeString('en-GB') + ' · ' + t.toLocaleDateString('en-GB')
      : String(this.data.simTime);
    el.liveWx.textContent = 'RAIN — ' + (lvl || '--') + ' · 24°C';
    const hwKeys = ['esp32', 'water_level_sensor', 'flow_sensor', 'gate_actuator'];
    for (let i = 0; i < 4; i++) {
      el.hw[i].textContent = String(this.data.hardware[hwKeys[i]] || 'NOT_CONNECTED')
        .toUpperCase().replace(/_/g, ' ');
    }
  }
}

/* ================= bootstrap — one init per page load ================= */
/* TestDriver REMOVED — Python simulation state is the sole input via postMessage. */
const root = document.getElementById('twin-root');
let app = null;
try {
  app = new ReservoirTwinRenderer(root, { testControls: true });
} catch (e) {
  console.error("Renderer initialization failed:", e);
  /* boot overlay already shows the failure reason; nothing further to do */
}
if (app) {
  /* STAGE 12 — NO console state-push handle.
   *
   * The renderer used to be exposed on `window` with a documented usage of
   * pushing a state object straight into the twin, i.e. any script on the page
   * (or the console) could inject arbitrary reservoir state. That is a
   * client-side state-injection path, so it is GONE. The page now publishes a
   * read-only readiness flag (used by the boot watchdog) and nothing else.
   *
   * The twin is driven ONLY by the authoritative `/ws/state` feed. */
  window.__twinReady = true;
  window.ReservoirTwinRenderer = ReservoirTwinRenderer;

  /* Theme: init toggle + apply 3D mood for the active theme (presentation only) */
  ThemeManager.init();
  ThemeManager.onChange(theme => { if (app) app.applyTheme3D(theme); });
  app.applyTheme3D(ThemeManager.current);

  /* Initialize API connection */
  const api = new TwinAPI((state) => {
    app.updateState(state);
  });
  window.__twin_api = api;

  /* Bind Simulation Controls */
  const bindEvent = (selector, eventName, handler) => {
    const el = document.querySelector(selector);
    if (el) el.addEventListener(eventName, handler);
  };
  const bindClick = (selector, handler) => bindEvent(selector, 'click', handler);
  const bindChange = (selector, handler) => bindEvent(selector, 'change', handler);
  const bindInput = (selector, labelSelector, handler) => {
    const el = document.querySelector(selector);
    const label = document.querySelector(labelSelector);
    if (el) {
      el.addEventListener('input', (e) => {
        if (label) label.textContent = e.target.value;
        handler(e);
      });
    }
  };

  bindClick('#btn-play', () => api.play());
  bindClick('#btn-pause', () => api.pause());
  bindClick('#btn-step', () => api.step());
  bindClick('#btn-reset', () => api.reset());
  
  bindInput('#ctl-speed', '#v-speed', (e) => api.setSpeed(Number(e.target.value) / 100));
  bindInput('[data-ctl="storm"]', '[data-v="storm"]', (e) => api.setStorm(Number(e.target.value)));
  
  for (let i = 1; i <= 4; i++) {
    bindInput(`[data-ctl="g${i}"]`, `[data-v="g${i}"]`, (e) => api.setGate(`reservoir_${i}`, Number(e.target.value)));
  }
  
  bindChange('[data-ctl="auto"]', (e) => api.setMode(e.target.checked ? 'AI' : 'MANUAL'));
}
</script>
</body>
</html>
